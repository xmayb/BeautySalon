<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your studio could be here</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A0E10;--oxblood:#6E1423;--bone:#EDE3D6;--smoke:#9A8C84;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font:400 1.0625rem/1.6 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;-webkit-font-smoothing:antialiased}
h1{font:500 clamp(3.2rem,11vw,10rem)/.92 "Cormorant","Times New Roman",Georgia,serif;letter-spacing:-.03em;max-width:12ch;opacity:0;transform:translateY(24px);animation:in 1.1s cubic-bezier(.2,.7,.2,1) .15s forwards}
p{color:var(--smoke);margin:28px 0 44px;max-width:36ch;opacity:0;animation:fade .8s ease .9s forwards}
a{color:var(--bone);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px;opacity:0;animation:fade .8s ease 1.1s forwards}
a:focus-visible{outline:2px solid #C08A5B;outline-offset:6px}
@keyframes in{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){h1,p,a{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
  <h1>Your studio could be here</h1>
  <p>Grań is a concept website. The studio, the team and the prices are made up.</p>
  <a href="index.html">Back to the site</a>
</body>
</html>
